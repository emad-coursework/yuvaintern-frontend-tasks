<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kova Studio — Single Page Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="#/" class="brand" data-route="/">
                <span class="brand-mark">K</span>
                <span>Kova Studio</span>
            </a>
            <nav class="main-nav" aria-label="SPA Navigation">
                <a href="#/" class="nav-link" data-route="/">Home</a>
                <a href="#/services" class="nav-link" data-route="/services">Services</a>
                <a href="#/work" class="nav-link" data-route="/work">Work</a>
                <a href="#/contact" class="nav-link" data-route="/contact">Contact</a>
            </nav>
        </div>
    </header>

    <main id="app" class="container app-view" aria-live="polite"></main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <strong>Kova Studio SPA</strong>
            <span id="route-indicator" class="route-pill">Route: /</span>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
